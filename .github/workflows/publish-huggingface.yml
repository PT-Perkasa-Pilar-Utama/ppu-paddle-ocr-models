name: Publish to Hugging Face

# Mirrors the model tree to the Hugging Face Hub, which serves the files over a
# CDN instead of Git LFS. The LFS copies stay where they are: every published
# ppu-paddle-ocr version resolves its models from the LFS URLs at runtime, so
# removing them would break already-installed releases.
#
# The checkout deliberately does NOT fetch LFS. This repository is over its LFS
# budget, so the batch API refuses `git lfs fetch`; the media host still serves
# the objects, and the script pulls them from there, verifying each one against
# the sha256 in its pointer.
#
# Requires an HF_TOKEN secret: a write token for the target repo.

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: Target Hugging Face repo
        required: true
        default: snowfluke/ppu-paddle-ocr-models
      dry_run:
        description: Fetch and verify the payload, upload nothing
        type: boolean
        default: false

concurrency:
  group: publish-huggingface
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pointers only
        uses: actions/checkout@v5
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet "huggingface_hub>=0.34"

      - name: Fetch, verify, and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_REF: ${{ github.ref_name }}
        run: python .github/scripts/publish_huggingface.py
